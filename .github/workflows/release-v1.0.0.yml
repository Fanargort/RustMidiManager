name: Publish Windows v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.0.0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet run --project RustMidiManager.Tests -c Release
      - name: Build Windows executable
        run: dotnet publish RustMidiManager -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 release/RustMidiManager.exe --target "$env:GITHUB_SHA" --title "Rust MIDI Manager v1.0.0" --notes-file RELEASE_NOTES.md
